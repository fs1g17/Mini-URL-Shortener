info:
  name: Create Link
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:8080/user/link
  body:
    type: json
    data: |-
      {
        "longURL": "https://google.com"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const cookie = bru.getVar("cookie");

        if (cookie)
          req.setHeader("Cookie", cookie);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
