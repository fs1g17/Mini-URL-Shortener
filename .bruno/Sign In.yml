info:
  name: Sign In
  type: http
  seq: 5

http:
  method: POST
  url: http://localhost:8080/sign-in
  body:
    type: json
    data: |-
      {
        "username": "theo",
        "password": "test"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
          bru.setVar("token", res.body.token)
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
