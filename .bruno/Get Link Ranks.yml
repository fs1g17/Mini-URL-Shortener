info:
  name: Get Link Ranks
  type: http
  seq: 7

http:
  method: GET
  url: http://localhost:8080/user/link-ranks?from=2026-09-01&to=2026-09-10
  params:
    - name: from
      value: 2026-09-01
      type: query
    - name: to
      value: 2026-09-10
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const cookie = bru.getVar("cookie");

        if (cookie)
          req.setHeader("Cookie", cookie);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
